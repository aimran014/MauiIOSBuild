name: Build MAUI iOS - Unsigned

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI
        run: |
          dotnet workload install maui

      - name: Restore
        run: |
          dotnet restore

      - name: Build unsigned iOS
        run: |
          dotnet publish \
            -f net8.0-ios \
            -c Release \
            -r ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:ProvisioningType=Manual

      - name: Show build output
        run: |
          find . -name "*.app" -type d

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find . -path "*/publish/*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app was not found"
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          mkdir -p unsigned-ipa/Payload
          cp -R "$APP_PATH" unsigned-ipa/Payload/

          cd unsigned-ipa
          zip -r ../TamsMobile-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: TamsMobile-unsigned.ipa
