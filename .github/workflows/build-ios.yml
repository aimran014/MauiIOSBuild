name: Build MAUI iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI
        run: dotnet workload install maui
		
		- name: Install Certificate
		  env:
			CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
			CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
		  run: |

			echo "$CERTIFICATE" | base64 --decode > certificate.p12

			security create-keychain -p "" build.keychain

			security default-keychain -s build.keychain

			security unlock-keychain -p "" build.keychain

			security import certificate.p12 \
			  -k build.keychain \
			  -P "$CERT_PASSWORD" \
			  -T /usr/bin/codesign

		- name: Install Provisioning Profile
		  env:
			PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
		  run: |

			mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

			echo "$PROFILE" | base64 --decode \
			  > ~/Library/MobileDevice/Provisioning\ Profiles/TAMS_Mobile_LPPKN.mobileprovision
		  
      - name: Restore
        run: dotnet restore

      - name: Build iOS
        run: |
          dotnet publish -f net8.0-ios -c Release /p:BuildIpa=true /p:EnableCodeSigning=false

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: "**/*.ipa"
